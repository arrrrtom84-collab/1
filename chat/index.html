<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>손맛분식 고객응대 챗봇</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #FFF7ED; /* Warm orange light background */
        }
        /* Custom scrollbar for chat container */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #FFEDD5;
        }
        ::-webkit-scrollbar-thumb {
            background: #F97316;
            border-radius: 3px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-bubble {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="flex flex-col h-screen max-w-md mx-auto bg-orange-50 shadow-xl border-x border-orange-200">

    <!-- Header -->
    <header class="bg-gradient-to-r from-orange-500 to-amber-600 text-white p-4 shadow-md flex items-center justify-between shrink-0">
        <div>
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🥟</span>
                <h1 class="text-xl font-bold tracking-wide">손맛분식</h1>
            </div>
            <p class="text-xs text-orange-100 mt-0.5">달빛시장 3번 골목 | 정성 가득한 우리 동네 분식집</p>
        </div>
        <div class="text-right bg-orange-600/60 px-3 py-1.5 rounded-xl border border-orange-400/40">
            <span class="block text-[10px] text-orange-200 font-medium">영업시간</span>
            <span class="text-xs font-bold text-white">평일 10~20시</span>
        </div>
    </header>

    <!-- FAQ Quick Buttons -->
    <section class="bg-white px-4 py-2.5 border-b border-orange-100 shrink-0">
        <p class="text-xs font-semibold text-orange-700 mb-2 flex items-center gap-1">
            <span>💡</span> 자주 묻는 질문 바로가기
        </p>
        <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar" id="faq-buttons-container">
            <!-- Dynamically populated or static quick buttons -->
            <button onclick="sendQuickFAQ('영업시간이 어떻게 되나요?')" class="whitespace-nowrap bg-orange-50 hover:bg-orange-100 text-orange-800 text-xs font-medium px-3 py-1.5 rounded-full border border-orange-200 transition active:scale-95 shrink-0">
                ⏰ 영업시간
            </button>
            <button onclick="sendQuickFAQ('휴무일은 언제인가요?')" class="whitespace-nowrap bg-orange-50 hover:bg-orange-100 text-orange-800 text-xs font-medium px-3 py-1.5 rounded-full border border-orange-200 transition active:scale-95 shrink-0">
                📅 휴무일 안내
            </button>
            <button onclick="sendQuickFAQ('배달 되나요?')" class="whitespace-nowrap bg-orange-50 hover:bg-orange-100 text-orange-800 text-xs font-medium px-3 py-1.5 rounded-full border border-orange-200 transition active:scale-95 shrink-0">
                🛵 배달 및 포장
            </button>
            <button onclick="sendQuickFAQ('대표 메뉴가 뭔가요?')" class="whitespace-nowrap bg-orange-50 hover:bg-orange-100 text-orange-800 text-xs font-medium px-3 py-1.5 rounded-full border border-orange-200 transition active:scale-95 shrink-0">
                ✨ 대표 메뉴
            </button>
        </div>
    </section>

    <!-- Chat Messages Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col">
        <!-- Welcome Message -->
        <div class="flex items-start space-x-2 chat-bubble">
            <div class="w-8 h-8 rounded-full bg-orange-500 text-white flex items-center justify-center font-bold text-sm shrink-0 shadow-sm">
                손맛
            </div>
            <div class="bg-white p-3.5 rounded-2xl rounded-tl-sm shadow-sm border border-orange-100 max-w-[80%]">
                <p class="text-xs sm:text-sm text-gray-800 leading-relaxed">
                    안녕하세요! <b>손맛분식</b>에 오신 걸 환영합니다. 달빛시장 3번 골목에 있어요! 😊<br>
                    궁금하신 점을 편하게 물어보세요!
                </p>
                <span class="block text-[10px] text-gray-400 mt-1 text-right">방금 전</span>
            </div>
        </div>
    </main>

    <!-- Input Form Footer -->
    <footer class="bg-white border-t border-orange-200 p-3 shrink-0">
        <form id="chat-form" onsubmit="handleChatSubmit(event)" class="flex items-center space-x-2">
            <input 
                type="text" 
                id="user-input" 
                placeholder="질문을 입력해 주세요 (예: 영업시간, 메뉴 추천 등)" 
                class="flex-1 bg-orange-50/50 border border-orange-200 text-gray-800 text-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition"
                autocomplete="off"
            >
            <button 
                type="submit" 
                class="bg-orange-500 hover:bg-orange-600 text-white font-medium px-5 py-3 rounded-xl transition shadow-md active:scale-95 flex items-center justify-center shrink-0">
                <span>전송</span>
            </button>
        </form>
        <p class="text-[10px] text-center text-gray-400 mt-2">
            손맛분식 챗봇은 등록된 내용을 바탕으로 답변해 드립니다.
        </p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // 10 Full FAQ Pairs as requested
        const faqDatabase = [
            {
                keywords: ["몇 시", "언제까지", "영업시간", "마감", "시간", "오픈", "열어", "닫아"],
                answer: "평일은 10시부터 20시까지, 토요일은 21시까지입니다. 일요일은 쉽니다."
            },
            {
                keywords: ["휴무", "쉬는날", "일요일", "쉬나요", "쉰", "쉬는"],
                answer: "일요일은 쉽니다. (평일 10~20시, 토요일은 21시까지 영업해요)"
            },
            {
                keywords: ["대표", "메뉴", "추천", "뭐가", "맛있는", "인기", "김밥", "떡볶이"],
                answer: "매콤달콤 쌀떡볶이와 속이 꽉 찬 손맛김밥, 그리고 바삭한 모둠튀김이 가장 인기 있는 대표 메뉴입니다!"
            },
            {
                keywords: ["배달", "배달되", "배달어디", "요기요", "배민", "쿠팡이츠", "배달료"],
                answer: "달빛시장 인근 지역은 직접 배달도 가능하고, 배달의민족 앱을 통해서도 주문하실 수 있습니다."
            },
            {
                keywords: ["포장", "테이크아웃", "싸갈수", "포장되", "포장주문"],
                answer: "네, 모든 메뉴 포장 가능합니다! 미리 전화 주시면 기다리지 않고 바로 찾아가실 수 있어요."
            },
            {
                keywords: ["위치", "어디", "찾아", "주소", "골목", "달빛시장"],
                answer: "저희 손맛분식은 '달빛시장 3번 골목' 초입에 위치해 있습니다. 시장 중앙 통로에서 골목으로 들어오시면 바로 보여요!"
            },
            {
                keywords: ["전화", "번호", "연락처", "전화번호", "문의"],
                answer: "가게 전화번호는 02-XXX-XXXX입니다. 단체 주문이나 예약 문의는 전화로 부탁드려요!"
            },
            {
                keywords: ["주차", "차", "주차장", "차를", "세울"],
                answer: "전통시장 내 위치하여 전용 주차장은 따로 없으나, 시장 공영주차장을 이용하시면 편리합니다."
            },
            {
                keywords: ["가격", "얼마", "요금", "비용", "메뉴판"],
                answer: "떡볶이 4,000원, 김밥 3,000원, 튀김(5개) 4,000원 등 가성비 좋은 가격으로 모시고 있습니다."
            },
            {
                keywords: ["카드", "현금", "결제", "제로페이", "온누리상품권", "계좌이체"],
                answer: "신용카드 결제는 물론, 제로페이와 온누리상품권 사용도 모두 가능합니다!"
            }
        ];

        const defaultAnswer = "확인이 어렵습니다. 사장님께 직접 여쭤봐주세요";

        // Find best match in FAQ using keyword matching score
        function findBestAnswer(userInput) {
            const cleanInput = userInput.trim().toLowerCase();
            let bestMatch = null;
            let maxScore = 0;

            for (let faq of faqDatabase) {
                let score = 0;
                for (let keyword of faq.keywords) {
                    if (cleanInput.includes(keyword.toLowerCase())) {
                        score += keyword.length; // Longer keyword match gets higher weight
                    }
                }
                if (score > maxScore) {
                    maxScore = score;
                    bestMatch = faq.answer;
                }
            }

            return maxScore > 0 ? bestMatch : defaultAnswer;
        }

        // Add message to chat view
        function appendMessage(sender, text) {
            const chatContainer = document.getElementById('chat-container');
            const isUser = sender === 'user';

            const messageWrapper = document.createElement('div');
            messageWrapper.className = `flex items-start space-x-2 chat-bubble ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;

            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm shrink-0 shadow-sm ${isUser ? 'bg-amber-600 text-white' : 'bg-orange-500 text-white'}`;
            avatar.innerText = isUser ? '손님' : '손맛';

            const bubble = document.createElement('div');
            bubble.className = `p-3.5 rounded-2xl shadow-sm border max-w-[80%] ${isUser ? 'bg-orange-600 text-white rounded-tr-sm border-orange-700' : 'bg-white text-gray-800 rounded-tl-sm border-orange-100'}`;
            
            const textParagraph = document.createElement('p');
            textParagraph.className = 'text-xs sm:text-sm leading-relaxed';
            textParagraph.innerText = text;

            const timeSpan = document.createElement('span');
            const now = new Date();
            const timeString = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            timeSpan.className = `block text-[10px] mt-1 text-right ${isUser ? 'text-orange-200' : 'text-gray-400'}`;
            timeSpan.innerText = timeString;

            bubble.appendChild(textParagraph);
            bubble.appendChild(timeSpan);
            messageWrapper.appendChild(avatar);
            messageWrapper.appendChild(bubble);

            chatContainer.appendChild(messageWrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Handle chat form submission
        function handleChatSubmit(event) {
            event.preventDefault();
            const inputField = document.getElementById('user-input');
            const userText = inputField.value.trim();

            if (!userText) return;

            // Display user message
            appendMessage('user', userText);
            inputField.value = '';

            // Simulate bot thinking response delay for natural UX
            setTimeout(() => {
                const answer = findBestAnswer(userText);
                appendMessage('bot', answer);
            }, 400);
        }

        // Trigger quick FAQ question from shortcut buttons
        function sendQuickFAQ(questionText) {
            appendMessage('user', questionText);
            setTimeout(() => {
                const answer = findBestAnswer(questionText);
                appendMessage('bot', answer);
            }, 400);
        }
    </script>
</body>
</html>
