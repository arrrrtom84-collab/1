<html lang="ko">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신나는 어린이 랜덤 포즈 챌린지 🤸‍♂️</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Jua & Gowun Dodum -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        jua: ['Jua', 'sans-serif'],
                        gowun: ['Gowun Dodum', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Jua', sans-serif;
            background: linear-gradient(135deg, #FFF5C0 0%, #FFD2E8 100%);
            min-height: 100vh;
            user-select: none;
        }

        .bounce-in {
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            70% { transform: scale(1.08) rotate(3deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .count-pop {
            animation: countPop 0.8s ease-out forwards;
        }

        @keyframes countPop {
            0% { transform: scale(0.2); opacity: 0; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .pulse-btn {
            animation: pulseGlow 1.8s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(255, 122, 0, 0.6); }
            70% { box-shadow: 0 0 0 18px rgba(255, 122, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 122, 0, 0); }
        }

        .svg-illustration {
            filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.1));
        }
    </style>
</head>
<body class="text-gray-800 flex flex-col min-h-screen justify-between p-4">

    <header class="max-w-xl mx-auto w-full text-center my-2">
        <div class="inline-flex items-center gap-3 bg-white/80 backdrop-blur-md px-6 py-3 rounded-full shadow-lg border-4 border-yellow-300">

                어린이 랜덤 포즈!

        </div>
    </header>

    <main class="max-w-md mx-auto w-full flex-grow flex items-center justify-center my-4">

            <!-- 1. INITIAL STATE (시작 전) -->
            <div id="initialState" class="flex flex-col items-center justify-center w-full my-auto">
                <div class="w-32 h-32 bg-amber-100 rounded-full flex items-center justify-center text-7xl mb-6 shadow-inner border-4 border-amber-300">
                    🎲
                </div>
                <h2 class="text-3xl font-extrabold text-gray-800 mb-2">어떤 포즈가 나올까?</h2>
                <p class="text-lg text-gray-600 font-gowun font-bold mb-8">
                    버튼을 누르면 <span class="text-orange-500">하나, 둘, 셋!</span> 하고<br>신나는 포즈가 나와요!
                </p>
                <button onclick="startCountdownSequence()" class="pulse-btn w-full bg-gradient-to-r from-orange-400 to-pink-500 hover:from-orange-500 hover:to-pink-600 text-white text-2xl font-black py-5 px-6 rounded-2xl shadow-xl border-b-4 border-pink-700 active:translate-y-1 active:border-b-0 transition transform active:scale-95 flex items-center justify-center gap-3">
                    <i class="fa-solid fa-play text-3xl"></i>
                    <span>포즈 도전 시작하기!</span>
                </button>
            </div>

            <!-- 2. COUNTDOWN STATE (하나, 둘, 셋 카운트다운) -->
            <div id="countdownState" class="hidden flex-col items-center justify-center w-full my-auto">
                <div id="countText" class="text-6xl md:text-7xl font-black text-amber-500 count-pop mb-4 tracking-wider">
                    하나...
                </div>
                <div id="countSubText" class="text-9xl my-4">
                    1️⃣
                </div>
                <p class="text-gray-500 font-gowun font-bold text-xl">준비하시고~ 차렷!</p>
            </div>

            <!-- 3. RESULT STATE (포즈 일러스트 및 결과) -->
            <div id="resultState" class="hidden flex-col items-center justify-between w-full h-full my-auto bounce-in">
                <!-- Top Emoji Header -->
                <div class="flex items-center justify-center gap-2 mb-2">
                    <span id="poseEmoji" class="text-5xl">🦩</span>
                    <h2 id="poseTitle" class="text-3xl font-black text-gray-800">우아한 플라밍고</h2>
                </div>

                <!-- SVG Illustration Area -->
                <div id="svgContainer" class="my-4 w-full h-52 flex items-center justify-center bg-amber-50 rounded-2xl p-3 border-2 border-dashed border-amber-300 svg-illustration">
                    <!-- SVG Stick Figure dynamically inserted -->
                </div>

                <!-- Simple Action Instruction -->
                <p id="poseInstruction" class="text-lg font-gowun font-bold text-indigo-700 bg-indigo-50 px-4 py-3 rounded-xl border border-indigo-100 w-full mb-6">
                    한 발로 서서 양팔을 날개처럼 펼쳐보세요!
                </p>

                <!-- Restart Button -->
                <button onclick="startCountdownSequence()" class="w-full bg-gradient-to-r from-green-400 to-emerald-500 hover:from-green-500 hover:to-emerald-600 text-white text-2xl font-black py-4 px-6 rounded-2xl shadow-lg border-b-4 border-emerald-700 active:translate-y-1 active:border-b-0 transition transform active:scale-95 flex items-center justify-center gap-3">
                    <i class="fa-solid fa-rotate-right text-3xl animate-spin-slow"></i>
                    <span>🔄 다시 시작하기</span>
                </button>
            </div>

        </div>
    </main>

    <footer class="text-center py-2 text-xs font-gowun text-gray-600">

    </footer>

        // --- STREAMING_CHUNK:Audio and Speech Synthesizer Functions ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playTone(freq, type, duration) {
            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // Voice TTS function for Korean
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 1.1;
                utterance.pitch = 1.3;
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- STREAMING_CHUNK:Flow Logic (Start -> Countdown -> Pose Reveal) ---
        let lastPoseIndex = -1;

        function startCountdownSequence() {
            const initialState = document.getElementById('initialState');
            const countdownState = document.getElementById('countdownState');
            const resultState = document.getElementById('resultState');

            const countText = document.getElementById('countText');
            const countSubText = document.getElementById('countSubText');

            // Hide initial/result views, show countdown view
            initialState.classList.add('hidden');
            resultState.classList.add('hidden');
            countdownState.classList.remove('hidden');
            countdownState.classList.add('flex');

            // Steps: 1 (하나) -> 2 (둘) -> 3 (셋!) -> Reveal!
            const steps = [
                { text: '하나...', emoji: '1️⃣', soundFreq: 400, speech: '하나' },
                { text: '둘...', emoji: '2️⃣', soundFreq: 520, speech: '둘' },
                { text: '셋!', emoji: '3️⃣', soundFreq: 680, speech: '셋' }
            ];

            let stepIndex = 0;

            function runStep() {
                if (stepIndex < steps.length) {
                    const current = steps[stepIndex];

                    // Reset animation
                    countText.classList.remove('count-pop');
                    void countText.offsetWidth; // trigger reflow
                    countText.classList.add('count-pop');

                    countText.textContent = current.text;
                    countSubText.textContent = current.emoji;

                    playTone(current.soundFreq, 'sine', 0.25);
                    speakText(current.speech);

                    stepIndex++;
                    setTimeout(runStep, 1000);
                } else {
                    // Countdown complete! Show Pose Result!
                    revealPoseResult();
                }
            }

            runStep();
        }

        function revealPoseResult() {
            const countdownState = document.getElementById('countdownState');
            const resultState = document.getElementById('resultState');

            countdownState.classList.remove('flex');
            countdownState.classList.add('hidden');

            // Pick Random Pose (avoid repeating same pose back to back)
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * POSES.length);
            } while (randomIndex === lastPoseIndex && POSES.length > 1);
            
            lastPoseIndex = randomIndex;
            const pose = POSES[randomIndex];

            // Render pose info
            document.getElementById('poseEmoji').textContent = pose.emoji;
            document.getElementById('poseTitle').textContent = pose.title;
            document.getElementById('poseInstruction').textContent = pose.instruction;
            document.getElementById('svgContainer').innerHTML = pose.svg;

            // Show Result Card with bounce animation
            resultState.classList.remove('hidden');
            resultState.classList.add('flex');

            // Confetti Blast
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            // Play fanfare sound & speak pose name
            playTone(880, 'triangle', 0.4);
            setTimeout(() => playTone(1046.5, 'triangle', 0.5), 150);
            speakText(`${pose.title}! ${pose.instruction}`);
        }
    </script>
