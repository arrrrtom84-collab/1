                { id: 's102', num: 2, grade: 1, name: '이민호', parentPhone: '010-8426-2879', studentPhone: '010-8312-7644' },

                { id: 's104', num: 4, grade: 4, name: '정성훈', parentPhone: '010-9331-4309', studentPhone: '010-6334-1903' },
                { id: 's105', num: 5, grade: 4, name: '정혜성', parentPhone: '010-4795-4411', studentPhone: '010-6543-7150' },

        const generateInitialLogs = () => {
            return {
                'c1_2026-05-07': {

                    specialNote: '학생 안전지도 이상 없음',
                    currentLesson: '36~37',
                    totalLesson: '37',
                    checklists: { clean: true, equipment: true, safety: true },
                    attendance: {
                        's101': { p1: '출석', p2: '출석', p3: '선택안함', exitStatus: '화요일만' },
                        's102': { p1: '출석', p2: '출석', p3: '선택안함', exitStatus: '화요일만' },
                        's103': { p1: '출석', p2: '결석', p3: '선택안함', exitStatus: '연계형' },
                        's104': { p1: '출석', p2: '출석', p3: '선택안함', exitStatus: '연계형' },
                        's105': { p1: '출석', p2: '출석', p3: '선택안함', exitStatus: '귀가' },
                        's106': { p1: '출석', p2: '출석', p3: '선택안함', exitStatus: '연계형' }
                    }
                }
            };
        };

        function App() {
            const [classes, setClasses] = useState(() => {
                const saved = localStorage.getItem('stitch_classes');
                return saved ? JSON.parse(saved) : DEFAULT_CLASSES;
            });

            const [students, setStudents] = useState(() => {
                const saved = localStorage.getItem('stitch_students');
                return saved ? JSON.parse(saved) : DEFAULT_STUDENTS;
            });

            const [logs, setLogs] = useState(() => {
                const saved = localStorage.getItem('stitch_logs');
                return saved ? JSON.parse(saved) : generateInitialLogs();
            });

            const [activeTab, setActiveTab] = useState('report');
            const [selectedClassId, setSelectedClassId] = useState(classes[0]?.id || 'c1');
            const [editingClassId, setEditingClassId] = useState(null);
            const [selectedDate, setSelectedDate] = useState('2026-05-07');
            const [selectedMonth, setSelectedMonth] = useState('2026-05');
            const [notification, setNotification] = useState(null);

            useEffect(() => {
                localStorage.setItem('stitch_classes', JSON.stringify(classes));
            }, [classes]);

            useEffect(() => {
                localStorage.setItem('stitch_students', JSON.stringify(students));
            }, [students]);

            useEffect(() => {
                localStorage.setItem('stitch_logs', JSON.stringify(logs));
            }, [logs]);

            const showToast = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(null), 3000);
            };

            const selectedClass = classes.find(c => c.id === selectedClassId) || classes[0];
            const logKey = `${selectedClassId}_${selectedDate}`;

            const currentLog = logs[logKey] || {
                classId: selectedClassId,
                date: selectedDate,
                dayOfWeek: new Date(selectedDate).toLocaleDateString('ko-KR', { weekday: 'short' }),
                checkStatus: 'o',
                workingHours: selectedClass?.workingHoursText || '14:10 ~ 15:40\n( 2 시간 )',
                instructor: selectedClass?.instructor?.replace(' 강사님', '') || '최정임',
                room: selectedClass?.room || '후관3층음악실',
                topicContent: '',
                specialNote: '',
                currentLesson: '1~2',
                totalLesson: '2',
                checklists: { clean: true, equipment: true, safety: true },
                attendance: {}
            };

            const currentClassStudents = students[selectedClassId] || [];

            const handleLogChange = (field, value) => {
                setLogs(prev => ({
                    ...prev,
                    [logKey]: {
                        ...currentLog,
                        [field]: value
                    }
                }));
            };

            const handleAttendanceChange = (studentId, field, value) => {
                const updatedAttendance = {
                    ...currentLog.attendance,
                    [studentId]: {
                        ...currentLog.attendance[studentId],
                        [field]: value
                    }
                };
                handleLogChange('attendance', updatedAttendance);
            };

            const handleSaveLog = () => {
                setLogs(prev => ({
                    ...prev,
                    [logKey]: {
                        ...currentLog,
                        classId: selectedClassId,
                        date: selectedDate
                    }
                }));
                showToast('내용이 성공적으로 저장되었습니다!');
            };

            const handleDeleteClass = (id, name) => {
                if (classes.length <= 1) {
                    alert('최소 1개 이상의 학교/강좌가 유지되어야 합니다.');
                    return;
                }
                if (window.confirm(`'${name}' 강좌를 정말 삭제하시겠습니까? 관련 학생 데이터와 출결 기록도 함께 삭제됩니다.`)) {
                    setClasses(prev => prev.filter(c => c.id !== id));
                    setStudents(prev => {
                        const copy = { ...prev };
                        delete copy[id];
                        return copy;
                    });
                    const remaining = classes.filter(c => c.id !== id);
                    if (remaining.length > 0) {
                        setSelectedClassId(remaining[0].id);
                    }
                    showToast(`[${name}] 학교가 삭제되었습니다.`);
                }
            };

            const generateHwpContent = (targetClass, targetMonth) => {
                const [year, month] = targetMonth.split('-');
                const monthLogs = Object.values(logs).filter(l => 
                    l.classId === targetClass.id && l.date.startsWith(targetMonth)
                ).sort((a, b) => a.date.localeCompare(b.date));

                const classSts = students[targetClass.id] || [];
                const lastDay = new Date(year, month, 0).getDate();
                const periodStr = `${year} . ${parseInt(month)} . 1 . ~ ${year} . ${parseInt(month)} . ${lastDay} .`;

                return `<!DOCTYPE html>
<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">

                    <h2 style="font-size: 16pt; margin: 6px 0;">( ${targetClass.name} )부 근무상황부</h2>
                </td>

                <tr><th>지도강사(서명)</th>${Array.from({ length: 4 }).map((_, i) => `<td>${monthLogs[i] ? targetClass.instructor?.replace(' 강사님','') : ''}</td>`).join('')}</tr>

                <tr style="background: #eee;">

                    ${Array.from({ length: 4 }).map((_, i) => {

                <tr><th>근무시간</th>${Array.from({ length: 4 }).map((_, i) => `<td style="white-space: pre-line;">${monthLogs[i + 8]?.workingHours || ': ~ :\n( 시간 )'}</td>`).join('')}</tr>
                <tr><th>지도강사(서명)</th>${Array.from({ length: 4 }).map((_, i) => `<td>${monthLogs[i + 8] ? targetClass.instructor?.replace(' 강사님','') : ''}</td>`).join('')}</tr>
            </tbody>
        </table>
        <table>
            <tr>
                <th style="background: #eee; width: 20%;">금월 누적 차시</th>
                <td style="text-align: left; padding-left: 20px; font-weight: bold;">총 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 차시</td>
            </tr>
        </table>
    </div>

        <table style="border: none; margin-bottom: 6px;">

                <td style="border: none; width: 160px;">

                            ← 대시보드로 돌아가기
                        </button>
                    </div>

                    <form onSubmit={handleSaveSchool} className="space-y-4">
                        <div className="stitch-card p-4 space-y-3">
                            <h3 className="text-xs font-extrabold text-slate-800 flex items-center space-x-1 border-b pb-2">
                                <span>🏫</span>
                                <span>학교 및 강좌 정보</span>
                            </h3>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-[11px] font-bold text-slate-600 mb-1">학교명 <span className="text-rose-500">*</span></label>
                                    <input
                                        type="text"
                                        required
                                        placeholder="예: 서울초등학교"
                                        value={schoolName}
                                        onChange={(e) => setSchoolName(e.target.value)}
                                        className="w-full text-xs font-bold border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-stitch-brand focus:outline-none"
                                    />
                                </div>

                                <div>
                                    <label className="block text-[11px] font-bold text-slate-600 mb-1">부서(강좌명) <span className="text-rose-500">*</span></label>
                                    <input
                                        type="text"
                                        required
                                        placeholder="예: 한자, 로봇코딩, 주산"
                                        value={courseName}
                                        onChange={(e) => setCourseName(e.target.value)}
                                        className="w-full text-xs font-bold border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-stitch-brand focus:outline-none"
                                    />
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-[11px] font-bold text-slate-600 mb-1">학년도</label>
                                    <input
                                        type="text"
                                        value={academicYear}
                                        onChange={(e) => setAcademicYear(e.target.value)}
                                        className="w-full text-xs font-bold border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-stitch-brand focus:outline-none"
                                    />
                                </div>

                                <div>
                                    <label className="block text-[11px] font-bold text-slate-600 mb-1">대상 학년 / 반</label>
                                    <input
                                        type="text"
                                        placeholder="예: 3학년 2반, 4학년 1반"
                                        value={subTitle}
                                        onChange={(e) => setSubTitle(e.target.value)}
                                        className="w-full text-xs font-bold border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-stitch-brand focus:outline-none"
                                    />
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-[11px] font-bold text-slate-600 mb-1">수업 요일 및 시간</label>
                                    <input
                                        type="text"
                                        placeholder="예: 목요일 14:10 ~ 15:40"
                                        value={schedule}
                                        onChange={(e) => setSchedule(e.target.value)}
                                        className="w-full text-xs font-bold border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-stitch-brand focus:outline-none"
                                    />
                                </div>

                                <div>
                                    <label className="block text-[11px] font-bold text-slate-600 mb-1">지도 장소</label>
                                    <input
                                        type="text"
                                        placeholder="예: 후관 3층 음악실"
                                        value={room}
                                        onChange={(e) => setRoom(e.target.value)}
                                        className="w-full text-xs font-bold border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-stitch-brand focus:outline-none"
                                    />
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <div>
                                    <label className="block text-[11px] font-bold text-slate-600 mb-1">지도강사 이름</label>
                                    <input
                                        type="text"
                                        value={instructor}
                                        onChange={(e) => setInstructor(e.target.value)}
                                        className="w-full text-xs font-bold border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-stitch-brand focus:outline-none"
                                    />
                                </div>

                                <div>
                                    <label className="block text-[11px] font-bold text-slate-600 mb-1">근무상황부 시간 표기</label>
                                    <input
                                        type="text"
                                        value={workingHoursText}
                                        onChange={(e) => setWorkingHoursText(e.target.value)}
                                        className="w-full text-xs font-bold border border-slate-200 rounded-xl p-2.5 focus:ring-2 focus:ring-stitch-brand focus:outline-none"
                                    />
                                </div>
                            </div>
                        </div>

                        <div className="stitch-card p-4 space-y-3">
                            <div className="flex justify-between items-center border-b pb-2">
                                <h3 className="text-xs font-extrabold text-slate-800 flex items-center space-x-1">
                                    <span>👨‍🎓</span>
                                    <span>수강생 명단 관리 ({studentList.filter(s => s.name.trim()).length}명)</span>
                                </h3>
                                <div className="space-x-2 flex">
                                    <button
                                        type="button"
                                        onClick={handleFillSampleStudents}
                                        className="text-[11px] font-bold bg-amber-50 text-amber-700 border border-amber-200 px-2.5 py-1 rounded-lg hover:bg-amber-100 transition-all"
                                    >
                                        ⚡ 예시 명단 채우기
                                    </button>
                                    <button
                                        type="button"
                                        onClick={handleAddStudentRow}
                                        className="text-[11px] font-bold bg-stitch-100 text-stitch-brand px-2.5 py-1 rounded-lg hover:bg-stitch-200 transition-all"
                                    >
                                        + 학생 추가
                                    </button>
                                </div>
                            </div>

                            <div className="space-y-2 max-h-72 overflow-y-auto pr-1">
                                {studentList.map((st, index) => (
                                    <div key={index} className="flex items-center space-x-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-xs">
                                        <span className="w-6 text-center font-black text-stitch-brand">{index + 1}</span>
                                        <select
                                            value={st.grade}
                                            onChange={(e) => handleStudentChange(index, 'grade', e.target.value)}
                                            className="w-16 font-bold border border-slate-300 rounded-lg p-1.5 bg-white text-xs focus:outline-none focus:border-stitch-brand"
                                        >
                                            {[1, 2, 3, 4, 5, 6].map(g => (
                                                <option key={g} value={g}>{g}학년</option>
                                            ))}
                                        </select>
                                        <input
                                            type="text"
                                            placeholder="학생 이름"
                                            value={st.name}
                                            onChange={(e) => handleStudentChange(index, 'name', e.target.value)}
                                            className="w-24 font-bold border border-slate-300 rounded-lg p-1.5 text-xs focus:outline-none focus:border-stitch-brand"
                                        />
                                        <input
                                            type="text"
                                            placeholder="보호자 연락처"
                                            value={st.parentPhone}
                                            onChange={(e) => handleStudentChange(index, 'parentPhone', e.target.value)}
                                            className="flex-1 font-medium border border-slate-300 rounded-lg p-1.5 text-xs focus:outline-none focus:border-stitch-brand"
                                        />
                                        <input
                                            type="text"
                                            placeholder="학생 연락처"
                                            value={st.studentPhone}
                                            onChange={(e) => handleStudentChange(index, 'studentPhone', e.target.value)}
                                            className="flex-1 font-medium border border-slate-300 rounded-lg p-1.5 text-xs focus:outline-none focus:border-stitch-brand"
                                        />
                                        {studentList.length > 1 && (
                                            <button
                                                type="button"
                                                onClick={() => handleRemoveStudentRow(index)}
                                                className="text-rose-500 font-bold p-1 hover:bg-rose-50 rounded"
                                            >
                                                ✕
                                            </button>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="flex gap-2">
                            <button
                                type="submit"
                                className="flex-1 py-3.5 bg-stitch-brand hover:bg-stitch-600 text-white font-extrabold text-sm rounded-2xl shadow-lg transition-all flex items-center justify-center space-x-2"
                            >
                                <span>{isEditing ? '💾' : '✨'}</span>
                                <span>{isEditing ? '수정 사항 저장하기' : '새 학교 및 강좌 등록 완료'}</span>
                            </button>

                            {isEditing && (
                                <button
                                    type="button"
                                    onClick={() => {
                                        handleDeleteClass(editingClassId, `${schoolName} ${courseName}부`);
                                        setEditingClassId(null);
                                        setActiveTab('dashboard');
                                    }}
                                    className="px-4 py-3.5 bg-rose-500 hover:bg-rose-600 text-white font-extrabold text-sm rounded-2xl shadow-lg transition-all flex items-center justify-center space-x-1"
                                >
                                    <span>🗑️</span>
                                    <span>삭제</span>
                                </button>
                            )}
                        </div>
                    </form>
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
